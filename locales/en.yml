  skip_to_content: Skip to main content
  about:
    application: source-available web application
    other_orgs: many other organizations
    text: Originally created to simplify the management of %{ragedevert}, CSA Admin has continuously evolved over the years to meet the diverse needs of %{other_orgs}. CSA Admin is a %{application}. It is designed to be simple, efficient, and intuitive. It is developed with passion by %{author}, who has been dedicated to making CSA administration easier for over 10 years.
    title: About CSA Admin
  call_to_action: Explore the demo
  talk_to_you: Let's talk
  contact:
    text: Explore the demo on your own, or write me at %{mail} and I'll walk you through it on a screen share.
    title: See it in action
  demo_url: https://admin.csa-admin.org/demo/new
  email: Email
  features:
    activity:
      description: Do your members participate in fieldwork or basket preparation? Everything is provided to help you <strong>manage your activities</strong>, registrations, and validations of each participation.
      title: Member Participation
    basket_content:
      description: Efficiently distribute your harvests among all your subscribers based on basket size and price. Track how your basket value and vegetable mix evolve throughout the year.
      title: Basket Content and Value
    billing:
      description: Create and send <strong>QR invoices</strong> with reference numbers by email, receive <strong>daily payment statements</strong> in your bank account (EBICS), support <strong>SEPA Direct Debit</strong>, and send reminders automatically.
      title: Automated Billing
    communication:
      description: Every email sent to your members can be easily modified. Choose the content and style that suits you. A sophisticated <strong>newsletter</strong> system is also integrated.
      title: Personalized Communication
    deliveries:
      description: Easily plan your deliveries. Special needs, two deliveries per week? Every other week? It's possible! <strong>Absences</strong> are also automatically deducted.
      title: Delivery Schedule
    memberships:
      description: Registration form, waiting list, supporting members, <strong>trial baskets</strong>, supplements, … everything is provided to efficiently manage your members. <strong>GDPR/nFADP</strong> compliant.
      title: Members and Memberships
    opencode:
      description: Fully translated into English, French, German, Italian, and Dutch, CSA Admin is also developed as %{opencode_link} under the %{license_link}, so you can contribute and suggest improvements.
      license: O'Saasy license
      opencode: source-available code
      title: Multilingual and Source Available
    renewal:
      description: Is it the end of the year? With one click, quickly send a renewal request to all your subscribers. A <strong>renewal form</strong> and optional <strong>bidding round</strong> are available on their member account.
      title: Simplified Renewal
    shop:
      description: Offer your subscribers <strong>additional products</strong> to enhance their basket with each delivery. An online shop is available on their member account. Stock management included!
      title: Online Shop
    subtitle: "CSA Admin is built for the specific needs of <span class='whitespace-nowrap'><strong class='text-logo-green'>C</strong>ommunity <strong class='text-logo-green'>S</strong>upported <strong class='text-logo-green'>A</strong>griculture</span>."
    subtitle2: "Each CSA is unique, so some modules are optional, at your convenience. Other needs? Just ask!"
    title: "Everything you need …"
    title2: "… and much more!"
  footer:
    developed_by: CSA Admin is developed with passion by %{author_link}.
  header:
    about: About
    demo: Demo
