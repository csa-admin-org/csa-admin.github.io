    description: Application web en code ouvert pour gérer efficacement votre ACP (Agriculture Contractuelle de Proximité). Explorez la démo, ou parlons-en.
    title: CSA Admin - Simplifiez la gestion de votre ACP
    path: /acp/
  subtitle: Depuis 2014, %{orgs_link} en Suisse, en Allemagne et aux Pays-Bas utilisent CSA Admin et gèrent plus de <span class='font-semibold'>%{baskets_count} paniers</span> par an. Rejoignez-les !
  subtitle_orgs_link: <span class="whitespace-nowrap">%{orgs_count} organisations</span>
